name: build

on:
  push:
    branches: [ unstable, '[0-9]+.[0-9]+.x' ]
  pull_request:
    branches: [ unstable, '[0-9]+.[0-9]+.x' ]
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Install ubuntu dependencies
      if: ${{ contains(matrix.os, 'ubuntu') }}
      run: >
        sudo apt-get update &&
        sudo apt-get install
        cmake
        ninja-build
        g++
        gfortran
        hdf5-tools
        libboost-dev
        libomp-dev
        libfftw3-dev
        libgmp-dev
        libhdf5-dev
        libopenblas-dev
        libopenmpi-dev
        openmpi-bin
        openmpi-common
        python3-dev
        python3-mpi4py
        python3-numpy
        python3-pip
        python3-scipy

    - name: Install homebrew dependencies
      if: ${{ contains(matrix.os, 'macos') }}
      run: |
        brew update
        brew install gcc llvm libomp boost fftw hdf5 open-mpi openblas mpi4py numpy scipy

    - name: Set up Python venv
      run: |
        # --system-site-packages exposes apt- (Linux) / brew- (macOS) installed mpi4py/numpy/scipy
        python3 -m venv --system-site-packages $HOME/.venv/my_python
        echo "VIRTUAL_ENV=$HOME/.venv/my_python" >> $GITHUB_ENV
        echo "$HOME/.venv/my_python/bin"         >> $GITHUB_PATH

    - name: Build & Install TRIQS
      env:
        TRIQS_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
      run: |
        git ls-remote --exit-code --heads https://github.com/TRIQS/triqs "$TRIQS_BRANCH" > /dev/null 2>&1 || TRIQS_BRANCH=unstable
        git clone https://github.com/TRIQS/triqs --branch "$TRIQS_BRANCH"
        cmake -S triqs -B triqs/build -G Ninja \
          -DPython_EXECUTABLE=$VIRTUAL_ENV/bin/python \
          -DBuild_Tests=OFF \
          -DCMAKE_INSTALL_PREFIX=$HOME/install
        cmake --build triqs/build --target install --verbose

    - name: Install app4triqs
      run: |
        source $HOME/install/share/triqs/triqsvars.sh
        pip install -e ".[test]"

    - name: Test app4triqs
      env:
        OPENBLAS_NUM_THREADS: "1"
      run: |
        source $HOME/install/share/triqs/triqsvars.sh
        pytest test/python -v
